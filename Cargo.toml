[package]
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/tests/**", "/README.md", "/README.crate.md", "/LICENSE", "/NOTICE"]
name = "zixcel-interaction"
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
description = "Transport-neutral resource, action, revision and change contracts"
license = "Apache-2.0"
readme = "README.crate.md"
repository = "https://github.com/zixcel/zixcel-interaction"
publish = ["crates-io"]

[workspace]
members = ["."]
resolver = "3"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
